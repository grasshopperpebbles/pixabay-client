# Publishes to PyPI when a tag like v0.1.0 is pushed. Uses PyPI Trusted Publishing: no token is stored anywhere.
# One-time setup on pypi.org: Account -> Publishing -> add a pending publisher: owner grasshopperpebbles,
# repository pixabay-client, workflow publish.yml, environment pypi.
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
